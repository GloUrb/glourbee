services:
  ui:
    image: ghcr.io/evs-gis/glourbee-ui:latest
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8501:8501"
    environment:
      - GLOURBEE_DATASTORE=$GLOURBEE_DATASTORE
      - GLOURBEE_BROKER_URL=$GLOURBEE_BROKER_URL
      - GLOURBEE_DB_URI=$GLOURBEE_DB_URI
    volumes:
      - data:/data
      - ./ui:/app/ui:ro # For dev only
      - ./glourbee:/app/glourbee:ro # For dev only

  worker:
    image: ghcr.io/evs-gis/glourbee-ui:latest
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    command: [celery, -A, glourbee.worker, worker, -c, "3", -l, INFO]
    environment:
      - GLOURBEE_DATASTORE=$GLOURBEE_DATASTORE
      - GLOURBEE_BROKER_URL=$GLOURBEE_BROKER_URL
      - GLOURBEE_DB_URI=$GLOURBEE_DB_URI
    volumes:
      - data:/data
      - ./ee-glourb-718927cf3d80.json:/app/earthengine-key.json:ro
      - ./ui:/app/ui:ro # For dev only
      - ./glourbee:/app/glourbee:ro # For dev only

  broker:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379" # For dev only
    volumes:
      - ./ui:/app/ui:ro # For dev only
      - ./glourbee:/app/glourbee:ro # For dev only

  db:
    image: postgis/postgis:latest
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # For dev only

volumes:
  data:
  db-data: